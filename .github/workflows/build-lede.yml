name: LEDE 固件编译
run-name: >-
  LEDE 固件编译 · ${{ github.event_name == 'workflow_dispatch' && '手动触发' || github.event_name == 'schedule' && '定时构建' || '自动触发' }}

'on':
  repository_dispatch:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '编译成功后发布 GitHub Release'
        required: true
        default: false
        type: boolean
      ssh_debug:
        description: '编译失败时开启 SSH 调试'
        required: false
        default: false
        type: boolean
  schedule:
    # 每天北京时间 (UTC+8) 上午 07:11 自动触发构建 (即 23:11 UTC)
    - cron: '11 23 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  CONFIG_FILE: config/custom.config
  CUSTOM_FEEDS_SH: scripts/custom_feeds.sh
  FILES_DIR: files
  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译固件
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v5

      - name: 恢复软件包清单历史缓存 (用于差分对比兜底)
        uses: actions/cache/restore@v4
        id: cache-manifest
        with:
          path: /tmp/manifest_cache
          key: lede-manifest-${{ github.run_id }}
          restore-keys: |
            lede-manifest-

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk genisoimage gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pigz pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 检查初始磁盘空间
        run: |
          echo "======================="
          echo "Filesystem Space Usage:"
          echo "======================="
          df -hT

      - name: 克隆 LEDE 源码
        working-directory: /workdir
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL lede
          ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

      - name: 加载自定义 Feeds 软件源
        run: |
          [ -e $CUSTOM_FEEDS_SH ] && chmod +x $CUSTOM_FEEDS_SH
          cd lede
          $GITHUB_WORKSPACE/$CUSTOM_FEEDS_SH

      - name: 更新与安装 Feeds 扩展
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo ">> 固定使用 helloworld 软件源提供的 xray-core..."
          ./scripts/feeds uninstall xray-core
          ./scripts/feeds install -f -p helloworld xray-core

          # 严格校验 xray-core 来源必须且仅为 helloworld
          if [ ! -L package/feeds/helloworld/xray-core ]; then
            echo "::error::未找到 helloworld feed 的 xray-core 软链接 (package/feeds/helloworld/xray-core)"
            exit 1
          fi

          if [ -e package/feeds/packages/xray-core ] || [ -L package/feeds/packages/xray-core ]; then
            echo "::error::packages feed 的 xray-core 仍然存在，未被完全移除"
            exit 1
          fi

          XRAY_PATH="$(readlink -f package/feeds/helloworld/xray-core)"
          EXPECTED_PATH="$(readlink -f feeds/helloworld/xray-core)"
          echo ">> 生效的 xray-core 路径: $XRAY_PATH"
          if [ -z "$XRAY_PATH" ] || [ "$XRAY_PATH" != "$EXPECTED_PATH" ]; then
            echo "::error::xray-core 真实路径异常，预期为: $EXPECTED_PATH，实际为: $XRAY_PATH"
            exit 1
          fi

          if [ ! -f "$XRAY_PATH/Makefile" ]; then
            echo "::error::未找到 xray-core 的 Makefile: $XRAY_PATH/Makefile"
            exit 1
          fi

          XRAY_VER="$(grep -m1 '^PKG_VERSION:=' "$XRAY_PATH/Makefile" | cut -d= -f2)"
          if [ -z "$XRAY_VER" ]; then
            echo "::error::无法从 $XRAY_PATH/Makefile 解析 PKG_VERSION"
            exit 1
          fi
          echo "✅ xray-core 来源与版本校验通过 (helloworld feed, 路径: $XRAY_PATH, 版本: $XRAY_VER)"

      - name: 加载自定义配置与覆盖文件
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE lede/.config
          [ -d $FILES_DIR ] && cp -r $FILES_DIR lede/
          cd lede
          make defconfig

      - name: 预下载依赖软件包并校验完整性 (make download)
        id: package
        run: |
          cd lede
          echo "=== 开始预下载依赖软件包 ==="
          MAX_RETRIES=3
          DOWNLOAD_OK=0
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo ">>> [尝试 $attempt/$MAX_RETRIES] 执行 make download ..."
            DL_OK=0
            if make download -j16 || make download -j1; then
              DL_OK=1
            else
              echo "::warning::make download 返回非零退出码。"
            fi

            echo ">>> 清理 0 字节空文件与临时锁文件..."
            find dl -type f -size 0c -exec rm -vf {} + 2>/dev/null || true
            find dl -type f \( -name '*.dl' -o -name '*.hash' \) -exec rm -vf {} + 2>/dev/null || true

            CORRUPTED=0

            # 1. 重点检测 linux-firmware 归档完整性
            for lf in $(find dl -type f -name 'linux-firmware-*.tar.xz' 2>/dev/null); do
              if ! xz -t "$lf" >/dev/null 2>&1; then
                echo "::error::发现损坏的 linux-firmware 归档: $lf，立即删除以触发重下..."
                rm -f "$lf"
                CORRUPTED=1
              fi
            done

            # 2. 依次校验各类压缩归档完整性
            for f in $(find dl -type f \( -name '*.xz' -o -name '*.txz' \) 2>/dev/null); do
              if ! xz -t "$f" >/dev/null 2>&1; then
                echo "::warning::损坏的 XZ 压缩包: $f，已清除"
                rm -f "$f"
                CORRUPTED=1
              fi
            done

            for f in $(find dl -type f \( -name '*.gz' -o -name '*.tgz' \) 2>/dev/null); do
              if ! gzip -t "$f" >/dev/null 2>&1; then
                echo "::warning::损坏的 GZ 压缩包: $f，已清除"
                rm -f "$f"
                CORRUPTED=1
              fi
            done

            for f in $(find dl -type f \( -name '*.bz2' -o -name '*.tbz2' \) 2>/dev/null); do
              if ! bzip2 -t "$f" >/dev/null 2>&1; then
                echo "::warning::损坏的 BZ2 压缩包: $f，已清除"
                rm -f "$f"
                CORRUPTED=1
              fi
            done

            for f in $(find dl -type f \( -name '*.zst' -o -name '*.tzst' \) 2>/dev/null); do
              if ! zstd -t "$f" >/dev/null 2>&1; then
                echo "::warning::损坏的 ZST 压缩包: $f，已清除"
                rm -f "$f"
                CORRUPTED=1
              fi
            done

            for f in $(find dl -type f -name '*.zip' 2>/dev/null); do
              if ! unzip -t -q "$f" >/dev/null 2>&1; then
                echo "::warning::损坏的 ZIP 压缩包: $f，已清除"
                rm -f "$f"
                CORRUPTED=1
              fi
            done

            if [ "$DL_OK" -eq 1 ] && [ "$CORRUPTED" -eq 0 ]; then
              echo "✅ make download 退出成功且所有下载归档完整性校验通过！"
              DOWNLOAD_OK=1
              echo "status=success" >> $GITHUB_OUTPUT
              break
            else
              if [ "$attempt" -eq "$MAX_RETRIES" ]; then
                echo "::error::经过 $MAX_RETRIES 次重试后下载或校验仍未全部通过，终止构建。"
                exit 1
              fi
              echo "⚠️ 检测到下载失败或部分损坏归档已清理，准备重新下载..."
              sleep 2
            fi
          done

          if [ "$DOWNLOAD_OK" -ne 1 ]; then
            echo "::error::依赖下载未成功完成，禁止进入正式编译。"
            exit 1
          fi

      - name: 开始编译固件
        id: compile
        run: |
          cd lede
          echo -e "$(nproc) thread compile"
          if ! make -j$(nproc); then
            echo "::warning::多线程编译失败，正在自动回退至单线程诊断模式 (V=s)..."
            set -o pipefail
            make -j1 V=s 2>&1 | tee /tmp/build_error.log
          fi
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 编译失败时启动 SSH 终端调试
        if: ${{ failure() && (github.event.inputs.ssh_debug == 'true' || env.SSH_DEBUG == 'true') }}
        uses: mxschmitt/action-tmate@v3

      - name: 检查编译后磁盘空间占用
        if: (!cancelled())
        run: |
          echo "======================="
          echo "Filesystem Space Usage:"
          echo "======================="
          df -hT
          echo "======================="
          echo "LEDE Directory Space Breakdown:"
          echo "======================="
          du -sh lede/dl 2>/dev/null || true
          du -sh lede/build_dir 2>/dev/null || true
          du -sh lede/staging_dir 2>/dev/null || true
          du -sh lede/bin 2>/dev/null || true

      - name: 整理固件打包产物与可追溯信息
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd lede/bin/targets/*/*
          rm -rf packages

          DATE_TAG="$(date +'%Y%m%d-%H%M')"
          TIME_TAG="$(date +'%Y.%m.%d-%H%M')"
          echo "BUILD_DATE=$DATE_TAG" >> $GITHUB_ENV
          echo "BUILD_TIME=$TIME_TAG" >> $GITHUB_ENV

          # 重命名主固件：保留 generic-squashfs-combined 字段并注入构建日期时间
          for file in openwrt-*-combined-efi.img.gz; do
            if [ -f "$file" ]; then
              new_name="$(echo "$file" | sed -e "s/^openwrt/lede/" -e "s/\.img\.gz$/-${DATE_TAG}.img.gz/")"
              mv -f "$file" "$new_name"
              # 使用 pigz/gzip 多线程极限压缩，进一步削减固件体积
              if command -v pigz >/dev/null 2>&1; then
                gzip -dc "$new_name" | pigz -9 > "${new_name}.tmp" && mv -f "${new_name}.tmp" "$new_name"
              fi
            fi
          done

          # 规范化软件包清单文件名称
          for mf in openwrt-*.manifest; do
            if [ -f "$mf" ]; then
              cp -f "$mf" packages-manifest.txt
              break
            fi
          done

          # 规范化并保留构建追溯文件 (config.buildinfo, feeds.buildinfo, version.buildinfo)
          for bf in openwrt-*.buildinfo; do
            if [ -f "$bf" ]; then
              base_bf="$(echo "$bf" | sed -E 's/^openwrt-[^-]+-[^-]+-[^-]+-//')"
              cp -f "$bf" "$base_bf"
            fi
          done

          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

          # 多级弹性获取上一个版本的 packages-manifest.txt 基线
          HIST_MANIFEST="/tmp/history_manifest/packages-manifest.txt"
          mkdir -p /tmp/history_manifest
          FOUND_BASELINE=0

          # 策略 1: 尝试从上一次成功的 Actions Run Artifacts 中拉取
          if [ "$FOUND_BASELINE" -eq 0 ] && command -v gh >/dev/null 2>&1; then
            echo ">> [1/3] 尝试通过 GitHub CLI 从最近一次成功的 Actions 运行获取历史 manifest..."
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            PREV_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "build-lede.yml" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
            if [ -n "$PREV_RUN_ID" ]; then
              echo "   定位到最近成功运行 Run ID: $PREV_RUN_ID"
              TMP_ART_DIR="/tmp/prev_artifacts"
              mkdir -p "$TMP_ART_DIR"
              if gh run download "$PREV_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$TMP_ART_DIR" 2>&1; then
                FOUND_FILE="$(find "$TMP_ART_DIR" -type f -name "packages-manifest.txt" 2>/dev/null | head -n 1)"
                if [ -n "$FOUND_FILE" ] && [ -s "$FOUND_FILE" ]; then
                  cp -f "$FOUND_FILE" "$HIST_MANIFEST"
                  FOUND_BASELINE=1
                  echo "   ✅ 成功从 Run $PREV_RUN_ID 的 Artifact 中获取历史 manifest (包数量: $(wc -l < "$HIST_MANIFEST"))"
                else
                  echo "   ℹ️ Run $PREV_RUN_ID 的 Artifact 中未找到有效的 packages-manifest.txt"
                fi
              else
                echo "   ⚠️ 下载 Run $PREV_RUN_ID 的 Artifact 失败"
              fi
              rm -rf "$TMP_ART_DIR"
            else
              echo "   ℹ️ 未查询到历史成功的 Actions 运行记录"
            fi
          fi

          # 策略 2: 尝试从最新的 GitHub Release 中获取 (显式绑定当前仓库)
          if [ "$FOUND_BASELINE" -eq 0 ] && command -v gh >/dev/null 2>&1; then
            echo ">> [2/3] 尝试通过 GitHub CLI 从最新 Release 获取历史 manifest..."
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            if gh release download --repo "$GITHUB_REPOSITORY" --pattern "packages-manifest.txt" --dir /tmp/history_manifest 2>&1; then
              if [ -s "$HIST_MANIFEST" ]; then
                FOUND_BASELINE=1
                echo "   ✅ 成功从最新 Release 获取历史 manifest (包数量: $(wc -l < "$HIST_MANIFEST"))"
              else
                echo "   ℹ️ 最新 Release 下载成功但 packages-manifest.txt 为空"
              fi
            else
              echo "   ℹ️ 当前仓库尚无 Release 或 Release 中不包含 packages-manifest.txt"
            fi
          fi

          # 策略 3: 尝试从 actions/cache 恢复的缓存中提取兜底
          if [ "$FOUND_BASELINE" -eq 0 ]; then
            echo ">> [3/3] 检查 actions/cache 恢复的历史清单缓存..."
            if [ -s "/tmp/manifest_cache/packages-manifest.txt" ]; then
              cp -f "/tmp/manifest_cache/packages-manifest.txt" "$HIST_MANIFEST"
              FOUND_BASELINE=1
              echo "   ✅ 成功从 actions/cache 恢复历史 manifest (包数量: $(wc -l < "$HIST_MANIFEST"))"
            else
              echo "   ℹ️ 未检测到有效 actions/cache 历史清单"
            fi
          fi

          if [ "$FOUND_BASELINE" -eq 1 ]; then
            echo ">> 历史基线清单获取完成，开始执行差分比对..."
          else
            echo ">> ℹ️ 所有历史来源均无基线记录，本次构建将被记录为首次构建基准。"
          fi

          # 软件包清单差分比对 (输出文本报告并写入 Step Summary)
          python3 $GITHUB_WORKSPACE/scripts/diff_manifest.py \
            "$HIST_MANIFEST" \
            packages-manifest.txt \
            --output-diff manifest-diff.txt \
            --summary

          # 准备持久化缓存文件 (供后续 actions/cache/save 保存)
          mkdir -p /tmp/manifest_cache
          cp -f packages-manifest.txt /tmp/manifest_cache/packages-manifest.txt

          # 生成 SHA256 校验文件 (针对最终重命名后的固件生成，带 .txt 后缀)
          sha256sum *combined-efi*.img.gz > sha256sums.txt 2>/dev/null || true

          # 清理原 openwrt 临时中间文件，确保产物目录纯净 (保留 buildinfo)
          rm -f openwrt-*.img* openwrt-*.manifest openwrt-*.bin

          echo "status=success" >> $GITHUB_OUTPUT

      - name: 保存本次软件包清单缓存
        uses: actions/cache/save@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          path: /tmp/manifest_cache
          key: lede-manifest-${{ github.run_id }}

      - name: 上传固件至 GitHub Artifacts
        uses: actions/upload-artifact@v6
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: LEDE-x86_64-EFI-${{ env.BUILD_TIME }}
          compression-level: 0
          path: |
            ${{ env.FIRMWARE_PATH }}/*combined-efi*.img.gz
            ${{ env.FIRMWARE_PATH }}/sha256sums.txt
            ${{ env.FIRMWARE_PATH }}/packages-manifest.txt
            ${{ env.FIRMWARE_PATH }}/manifest-diff.txt
            ${{ env.FIRMWARE_PATH }}/*.buildinfo

      - name: 生成 Release 发布信息
        id: tag
        if: steps.organize.outputs.status == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          TAG_NAME="v${{ env.BUILD_TIME }}"
          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          touch release.txt
          echo "### 🚀 LEDE x86_64 固件构建完成" >> release.txt
          echo "- **架构**: x86_64 Generic (EFI Boot)" >> release.txt
          echo "- **默认管理 IP**: 192.168.2.1" >> release.txt
          echo "- **IPv6**: 默认全局禁用" >> release.txt
          echo "- **构建时间**: $(date +'%Y-%m-%d %H:%M:%S')" >> release.txt
          echo "- **内置核心组件**: SSR-Plus (Xray, Mihomo), SQM, TTYD" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布固件至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag.outputs.status == 'success' && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE_PATH }}/*combined-efi*.img.gz
            ${{ env.FIRMWARE_PATH }}/sha256sums.txt
            ${{ env.FIRMWARE_PATH }}/packages-manifest.txt
            ${{ env.FIRMWARE_PATH }}/manifest-diff.txt
            ${{ env.FIRMWARE_PATH }}/*.buildinfo
